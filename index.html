<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div id="main">
        <div class="elem" id="top-left">
            <div id="square"></div>
        </div>
        <div class="elem" id="top-left-right">
            <div id="info">
                <h3>Menu</h3>
                <h4 class="dot">Home Page</h4>
                <h4 class="dot">Portfolio </h4>
                <h4 class="dot">Fashion-week-2026</h4>
                <h4 class="dot">News/Articles</h4>
                <h4 class="dot">Contacts</h4>
            </div>
        </div>
        <div class="elem" id="right">
            <video autoplay loop muted src="video.mp4.mp4"></video>
        </div>
        <div class="elem" id="top-left-mid">
            
            <h1 class="zoom">SELECT</h1>
            <h1 class="zoom">FASHION</h1>
            <h1 class="zoom">MOD.05 <sup>_</sup></h1>
            <h1 class="zoom">SCENE</h1>
           
        </div>
        <div class="elem" id="left-down">
            <p>Contact us for more designs. <br>If you like our design pls connect on LinkedIn.</p>
        </div>
        <div id="icon">
            <i class="ri-arrow-right-line"></i>
        </div>
        <div id="icon2">
            <i class="ri-menu-line"></i>
        </div>
        
    </div>
</body>
</html>
